<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPL Transport · ຂົນສົ່ງ EPL</title>
<link rel="icon" href="img/logo-epl.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/chung.css?v=__VER__">
</head>
<body>

<!-- ===== Đăng nhập ===== -->
<!-- Bố cục và kiểu dáng lấy từ bản mẫu đăng nhập anh gửi (đã bỏ khỏi dự án): nửa trái thương hiệu kèm
     sơ đồ tuyến, nửa phải biểu mẫu và khung chọn nhanh theo vai trò.
     Khác bản mẫu hai chỗ, đúng như yêu cầu: logo là ẢNH EPL thật chứ không phải ô chữ, và sơ đồ
     vẽ theo TUYẾN THẬT của họ (Kasi → Thà Bốc → Nậm Phao → cảng). -->
<div class="login" id="login">

  <aside class="hero">
    <div class="hero__brand">
      <img class="hero__logo" src="img/logo-epl.jpg" alt="EPL">
      <div><div class="hero__name">EPL Logistics</div>
        <div class="hero__sub" data-i18n="lg_brand_sub"></div></div>
    </div>

    <div class="hero__body">
      <div>
        <h1 data-i18n="login_title"></h1>
        <p class="hero__desc" data-i18n="login_sub"></p>
      </div>

      <svg class="route" viewBox="0 0 640 420" fill="none" aria-hidden="true">
        <defs><pattern id="luoi" width="32" height="32" patternUnits="userSpaceOnUse">
          <path d="M32 0H0V32" stroke="#fff" stroke-opacity=".06"/></pattern></defs>
        <rect width="640" height="420" fill="url(#luoi)"/>
        <path d="M80 80 C 150 110, 190 160, 250 185 S 360 225, 420 300 S 520 345, 570 360"
              stroke="#7fc8ad" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>
        <path class="route__done" d="M80 80 C 150 110, 190 160, 250 185 S 360 225, 420 300"
              stroke="#7fc8ad" stroke-width="3"/>
        <circle cx="80" cy="80" r="9" fill="#0b2a22" stroke="#7fc8ad" stroke-width="3"/>
        <text x="100" y="76" lang="lo">ກາສີ</text><text class="sm" x="100" y="96" data-i18n="lg_s1"></text>
        <circle cx="250" cy="185" r="8" fill="#0b2a22" stroke="#7fc8ad" stroke-width="3"/>
        <text x="268" y="166" lang="lo">ທ່າບົກ</text><text class="sm" x="268" y="186" data-i18n="lg_s2"></text>
        <circle cx="420" cy="300" r="8" fill="#0b2a22" stroke="#7fc8ad" stroke-width="3"/>
        <text x="438" y="296" lang="lo">ດ່ານ ນໍ້າພາວ</text><text class="sm" x="438" y="316" data-i18n="lg_s3"></text>
        <circle cx="570" cy="360" r="7" fill="#0b2a22" stroke="#7fc8ad" stroke-opacity=".5" stroke-width="3"/>
        <text class="dim" x="470" y="394" lang="lo">ທ່າເຮືອ</text>
        <!-- Bốn chấm XE trên đường (khác với chấm MỐC ở trên). Một chấm màu hổ phách là xe đi
             lâu chưa về, khớp với con số ở dải số liệu ngay dưới bản đồ. -->
        <g class="lg-xe" data-x="165" data-y="133" data-nhan="175,92"><circle cx="165" cy="133" r="6"/></g>
        <g class="lg-xe" data-x="330" data-y="228" data-nhan="300,198"><circle cx="330" cy="228" r="6"/></g>
        <g class="lg-xe lau" data-x="492" data-y="334" data-nhan="368,344"><circle cx="492" cy="334" r="6"/></g>
        <g class="lg-xe" data-x="545" data-y="352" data-nhan="430,330"><circle cx="545" cy="352" r="6"/></g>
        <g id="lg-nhan-xe" transform="translate(300,198)"><rect width="104" height="26" rx="6" fill="#1f8a6a"/>
          <text x="52" y="17" fill="#fff" font-size="11" font-weight="600" text-anchor="middle" data-i18n="lg_badge"></text></g>
      </svg>

      <!-- Dải số liệu: mô tả đúng CẢNH đang vẽ trên bản đồ ở trên, không phải số liệu công ty. -->
      <div class="hero__so">
        <div><b>4</b><span data-i18n="lg_st1"></span></div>
        <div><b class="lau">1</b><span data-i18n="lg_st2"></span></div>
        <div><b>2</b><span data-i18n="lg_st3"></span></div>
        <div><b>1</b><span data-i18n="lg_st4"></span></div>
      </div>

      <!-- Ba thẻ: mỗi thẻ một việc, một dòng mô tả và VAI nào làm. Câu mô tả phía trên nhấn vào
           vai trò nên bên dưới phải minh hoạ được điều đó.
           Cố ý KHÔNG lấy "Theo dõi tuyến" làm một thẻ: bản đồ ngay trên đầu đã là nó rồi. -->
      <div class="feats">
        <div class="feat"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          <div><b data-i18n="nav_dispatch"></b><span data-i18n="lg_c1_d"></span>
            <i data-i18n="lg_r1"></i></div></div>
        <div class="feat"><svg viewBox="0 0 24 24"><path d="M3 6h13v9H3z"/><path d="M16 9h3l2 3v3h-5"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>
          <div><b data-i18n="nav_issue"></b><span data-i18n="lg_c2_d"></span>
            <i data-i18n="lg_r2"></i></div></div>
        <div class="feat"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          <div><b data-i18n="nav_vouchers"></b><span data-i18n="lg_c3_d"></span>
            <i data-i18n="lg_r3"></i></div></div>
      </div>
    </div>

    <div class="hero__foot">SAMKET VILLAGE, SIKHOTTABONG · VIENTIANE · 020 5889 9983</div>
  </aside>

  <main class="panel">
    <div class="panel__top"><div class="lang lang-login" role="group" aria-label="Language"></div></div>

    <div class="panel__head">
      <h2 data-i18n="login_h"></h2>
      <div class="demo"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span data-i18n="login_demo"></span></div>
    </div>

    <div class="form">
      <label class="field"><span class="field__label"><b data-i18n="username"></b></span>
        <span class="field__box"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="lgU" autocomplete="username" spellcheck="false" data-i18n-ph="username"></span></label>

      <label class="field"><span class="field__label"><b data-i18n="password"></b></span>
        <span class="field__box"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="lgP" type="password" autocomplete="current-password" data-i18n-ph="password">
          <button type="button" class="eye" id="lgMat" data-i18n-title="show_pw">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              <path class="gach" d="M3 21 21 3"/></svg></button></span></label>

      <div class="row">
        <label class="remember"><input type="checkbox" id="lgNho" checked><span data-i18n="lg_remember"></span></label>
      </div>

      <div class="error" id="lgErr" role="alert" hidden></div>

      <button class="submit" id="lgBtn" type="button"><span data-i18n="login_btn"></span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    </div>

    <div class="divider"><span data-i18n="quick_pick"></span></div>
    <div class="roles" id="acctList"></div>
  </main>

</div>

<!-- ===== Ứng dụng ===== -->
<!-- Hai kiểu xem, người dùng tự chọn ở nút bánh răng: data-view="side" thanh bên, "top" thanh trên.
     Khối .lang và .userbox là MỘT bản duy nhất, đổi kiểu thì chuyển chỗ chứ không nhân đôi. -->
<div class="app" id="app" data-view="side" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <img class="mark" src="img/logo-epl.jpg" alt="EPL">
      <h1 data-i18n="brand"></h1>
    </div>
    <div class="side-tim">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="navTim" type="search" autocomplete="off" data-i18n-ph="nav_search">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-chan" id="sideChan">
      <div class="chan-oi" id="chanOi"></div>
      <button class="side-thu" id="btnThuGon" type="button" data-i18n-title="nav_collapse">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <!-- Kiểu thanh trên: tầng 1 thương hiệu + nhóm module, tầng 2 các màn của nhóm đang chọn -->
    <header class="tbar" id="tbar" hidden>
      <div class="tbar1">
        <div class="tbar-brand"><img src="img/logo-epl.jpg" alt="EPL"><b data-i18n="brand_short"></b></div>
        <div class="grow"></div>
        <div class="tbar-phai" id="tbarPhai"></div>
      </div>
      <nav class="tbar2" id="tbar2"></nav>
    </header>

    <header class="topbar" id="topbar">
      <h2 id="pageTitle"></h2>
      <div class="grow"></div>
      <div class="xuat-nut" id="xuatNut" hidden>
        <button class="btn sm" id="btnExcel" type="button" data-i18n-title="xuat_excel_goi_y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 12l4 5M12 12l-4 5"/></svg><span data-i18n="xuat_excel"></span></button>
        <button class="btn sm" id="btnPDF" type="button" data-i18n-title="xuat_pdf_goi_y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg><span data-i18n="xuat_pdf"></span></button>
      </div>
      <div class="topbar-phai" id="topbarPhai"></div>
    </header>
    <main class="page" id="noi-dung"></main>
  </div>
</div>

<!-- Khối ngôn ngữ và người dùng: js chuyển vào thanh bên hay thanh trên tuỳ kiểu xem -->
<div id="khoi-di-dong" hidden>
  <div class="lang lang-tha" id="langApp" aria-label="Language"></div>
  <div class="userbox" id="userbox">
    <button class="nguoi" id="btnNguoi" type="button">
      <span class="av" id="roleAv"></span>
      <span class="tt"><span class="nm" id="uName"></span><span class="rl2" id="uRole"></span></span>
      <svg class="mui" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="nguoi-menu" id="nguoiMenu" hidden>
      <button type="button" data-mn="giao-dien"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span data-i18n="view_settings"></span></button>
      <button type="button" data-mn="doi"><svg viewBox="0 0 24 24"><path d="M16 17l5-5-5-5M21 12H9M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg><span data-i18n="switch_acct"></span></button>
    </div>
  </div>
</div>

<!-- Hộp thoại trong ứng dụng — không dùng confirm()/alert() của trình duyệt -->
<dialog id="hop-thoai" class="hop-thoai">
  <form method="dialog">
    <h3 id="ht-tieu-de"></h3>
    <div id="ht-noi-dung" class="ht-noi-dung"></div>
    <div class="ht-nut">
      <button class="btn" value="huy" id="ht-huy"></button>
      <button class="btn primary" value="ok" id="ht-ok"></button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" hidden></div>

<script>window.EPL_VER = "__VER__";</script>
<script src="js/ngon_ngu.js?v=__VER__"></script>
<script src="js/chung.js?v=__VER__"></script>
<script src="js/xuat.js?v=__VER__"></script>
</body>
</html>
