<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPL Transport · ຂົນສົ່ງ EPL</title>
<link rel="icon" href="img/logo-epl.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/chung.css?v=__VER__">
<link rel="stylesheet" href="css/lich.css?v=__VER__">
<link rel="stylesheet" href="css/dang_nhap.css?v=__VER__">
</head>
<body>

<!-- ===== Đăng nhập ===== -->
<!-- Theo bản mẫu chủ dự án gửi chiều 30/09 (login_ne_theosep.zip): trái là thương hiệu và SƠ ĐỒ BẢY BƯỚC của một chuyến
     hàng — bấm một bước để xem việc, ai làm, và lọc tài khoản của vai đó; phải là biểu mẫu và khung chọn nhanh.
     Khác bản mẫu có chủ ý: logo là ẢNH EPL thật; không có dải số liệu "đang chạy" (chủ dự án chốt 30/09 — trang này ai
     cũng mở được, không lộ số phiếu); bấm thẻ tài khoản là vào thẳng (lối tắt demo). Sơ đồ vẽ ở js/dang_nhap.js,
     kiểu ở css/dang_nhap.css. Giữ nguyên các mã lgU · lgP · lgMat · lgNho · lgErr · lgBtn · acctList mà js/chung.js dùng. -->
<div class="login" id="login">
 <div class="lg-shell">
  <section class="hero">
    <header class="brand">
      <img class="hero__logo" src="img/logo-epl.jpg" alt="EPL">
      <div><b>EPL Logistics</b><span data-i18n="lg_brand_sub"></span></div>
    </header>

    <h1 data-i18n="login_title"></h1>
    <p class="intro" data-i18n="login_sub"></p>

    <div class="process">
      <p class="process-title" data-i18n="lg2_process"></p>
      <div class="map" id="lgMap">
        <svg class="map-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs><pattern id="lgLuoi" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M10 0H0v10" fill="none" stroke="rgba(255,255,255,.07)" stroke-width=".25" vector-effect="non-scaling-stroke"/></pattern></defs>
          <rect width="100" height="100" fill="url(#lgLuoi)"/>
          <path id="lgDuongXong" class="route route--done" d="" vector-effect="non-scaling-stroke"/>
          <path id="lgDuongChua" class="route route--todo" d="" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="nodes" id="lgBuoc" role="tablist"></div>
        <div class="truck" id="lgXe"><span class="truck-dot"></span><span class="truck-tag" data-i18n="lg_badge"></span></div>
      </div>
    </div>

    <div class="step-card" id="lgThe" role="tabpanel"></div>

    <footer class="hero-foot">SAMKET VILLAGE, SIKHOTTABONG · VIENTIANE · 020 5889 9983</footer>
  </section>

  <section class="lg-panel">
    <div class="lang lang-login" role="group" aria-label="Language"></div>

    <div class="login-body">
      <h2 data-i18n="login_h"></h2>
      <p class="demo-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg><span data-i18n="login_demo"></span></p>

      <div class="field">
        <label for="lgU" data-i18n="username"></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="lgU" class="input" autocomplete="username" autocapitalize="off" spellcheck="false" data-i18n-ph="username">
        </div>
      </div>
      <div class="field">
        <label for="lgP" data-i18n="password"></label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="lgP" class="input" type="password" autocomplete="current-password" data-i18n-ph="password">
          <button type="button" class="eye" id="lgMat" data-i18n-title="show_pw">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="gach" d="M3 21 21 3"/></svg></button>
        </div>
      </div>
      <label class="remember"><input type="checkbox" id="lgNho" checked><span data-i18n="lg_remember"></span></label>
      <div class="role-chip" id="lgVai" hidden></div>
      <div class="error" id="lgErr" role="alert" hidden></div>
      <button type="button" class="btn-login" id="lgBtn"><span data-i18n="login_btn"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

      <div class="quick-head"><span class="line"></span><span class="quick-title" id="lgNhanh"></span><span class="line"></span></div>
      <div class="accounts" id="acctList"></div>
    </div>
  </section>
 </div>
</div>

<!-- ===== Ứng dụng ===== -->
<!-- Hai kiểu xem, người dùng tự chọn ở nút bánh răng: data-view="side" thanh bên, "top" thanh trên.
     Khối .lang và .userbox là MỘT bản duy nhất, đổi kiểu thì chuyển chỗ chứ không nhân đôi. -->
<div class="app" id="app" data-view="side" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <img class="mark" src="img/logo-epl.jpg" alt="EPL">
      <h1 data-i18n="brand"></h1>
    </div>
    <div class="side-tim">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="navTim" type="search" autocomplete="off" data-i18n-ph="nav_search">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-chan" id="sideChan">
      <div class="chan-oi" id="chanOi"></div>
      <button class="side-thu" id="btnThuGon" type="button" data-i18n-title="nav_collapse">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <!-- Kiểu thanh trên: tầng 1 thương hiệu + nhóm module, tầng 2 các màn của nhóm đang chọn -->
    <header class="tbar" id="tbar" hidden>
      <div class="tbar1">
        <div class="tbar-brand"><img src="img/logo-epl.jpg" alt="EPL"><b data-i18n="brand_short"></b></div>
        <div class="grow"></div>
        <div class="tbar-phai" id="tbarPhai"></div>
      </div>
      <nav class="tbar2" id="tbar2"></nav>
    </header>

    <header class="topbar" id="topbar">
      <h2 id="pageTitle"></h2>
      <div class="grow"></div>
      <div class="xuat-nut" id="xuatNut" hidden>
        <button class="btn sm" id="btnExcel" type="button" data-i18n-title="xuat_excel_goi_y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 12l4 5M12 12l-4 5"/></svg><span data-i18n="xuat_excel"></span></button>
        <button class="btn sm" id="btnPDF" type="button" data-i18n-title="xuat_pdf_goi_y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg><span data-i18n="xuat_pdf"></span></button>
      </div>
      <div class="topbar-phai" id="topbarPhai"></div>
    </header>
    <main class="page" id="noi-dung"></main>
  </div>
</div>

<!-- Khối ngôn ngữ và người dùng: js chuyển vào thanh bên hay thanh trên tuỳ kiểu xem -->
<div id="khoi-di-dong" hidden>
  <div class="lang lang-tha" id="langApp" aria-label="Language"></div>
  <div class="userbox" id="userbox">
    <button class="nguoi" id="btnNguoi" type="button">
      <span class="av" id="roleAv"></span>
      <span class="tt"><span class="nm" id="uName"></span><span class="rl2" id="uRole"></span></span>
      <svg class="mui" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="nguoi-menu" id="nguoiMenu" hidden>
      <button type="button" data-mn="giao-dien"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span data-i18n="view_settings"></span></button>
      <button type="button" data-mn="doi"><svg viewBox="0 0 24 24"><path d="M16 17l5-5-5-5M21 12H9M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg><span data-i18n="switch_acct"></span></button>
    </div>
  </div>
</div>

<!-- Hộp thoại trong ứng dụng — không dùng confirm()/alert() của trình duyệt -->
<dialog id="hop-thoai" class="hop-thoai">
  <form method="dialog">
    <h3 id="ht-tieu-de"></h3>
    <div id="ht-noi-dung" class="ht-noi-dung"></div>
    <div class="ht-nut">
      <button class="btn" value="huy" id="ht-huy"></button>
      <button class="btn primary" value="ok" id="ht-ok"></button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" hidden></div>

<script>window.EPL_VER = "__VER__";</script>
<script src="js/ngon_ngu.js?v=__VER__"></script>
<script src="js/chung.js?v=__VER__"></script>
<script src="js/lich.js?v=__VER__"></script>
<script src="js/dang_nhap.js?v=__VER__"></script>
<script src="js/xuat.js?v=__VER__"></script>
<script src="js/hop_dong.js?v=__VER__"></script>
<script src="js/bien_ban.js?v=__VER__"></script>
<script src="js/nen_anh.js?v=__VER__"></script>
</body>
</html>
