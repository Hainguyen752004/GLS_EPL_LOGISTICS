<!-- Bán hàng — EPL bán phụ tùng, dầu cho bên ngoài. Một phiếu bán = xuất kho + hoá đơn bán + thu tiền.
     Mỗi bước để lại một tờ trong Sổ chứng từ (PXK_BAN · HD_BAN · PT_BAN) cho bên kế toán kéo về. -->
<div class="toolbar">
  <div class="field"><label data-i18n="month"></label><input type="month" id="bh-thang"></div>
  <div class="grow"></div>
  <span class="small muted" data-i18n="sale_hint"></span>
  <button class="btn primary" id="bh-moi"><span data-i18n="sale_new"></span></button>
</div>

<!-- Lập phiếu bán: đứng trần một thẻ, mở khi bấm "Lập phiếu bán" -->
<div class="card bh-lap" id="bh-lap" hidden>
  <div class="hd"><h3 data-i18n="sale_new"></h3><div class="grow"></div><span class="small muted" id="bh-so-moi"></span></div>
  <div class="bd">
    <div class="f-grid">
      <div class="field"><label data-i18n="c_date"></label><input type="date" id="bh-ngay"></div>
      <div class="field"><label data-i18n="sale_buyer"></label><select id="bh-loai-mua"><option value="kh" data-i18n="sale_buyer_kh"></option><option value="cx" data-i18n="sale_buyer_cx"></option></select></div>
      <div class="field bh-o-cx" hidden><label data-i18n="owner"></label><select id="bh-chu-xe"><option value=""></option></select></div>
      <div class="field bh-o-kh"><label data-i18n="customer"></label><select id="bh-khach"><option value=""></option></select></div>
      <div class="field bh-o-kh"><label data-i18n="sale_customer_free"></label><input id="bh-khach-ten" lang="lo"></div>
      <p class="small muted bh-o-cx" hidden style="grid-column:1/-1" data-i18n="sale_cx_hint"></p>
      <div class="field"><label data-i18n="cur"></label><select id="bh-tien-te"><option>LAK</option><option>USD</option><option>THB</option><option>VND</option></select></div>
      <div class="field" style="grid-column:span 2"><label data-i18n="note"></label><input id="bh-ghi-chu" lang="lo"></div>
    </div>
    <div class="tbl-wrap"><table class="tbl tbl-compact bh-dong">
      <thead><tr><th>#</th><th data-i18n="item_type"></th><th data-i18n="item"></th><th class="num" data-i18n="qty"></th><th class="num" data-i18n="unit_price"></th><th class="num" data-i18n="amount"></th><th></th></tr></thead>
      <tbody id="bh-dong"></tbody>
      <tfoot id="bh-chan"></tfoot>
    </table></div>
    <div class="bh-nut">
      <button class="btn quiet sm" id="bh-them-pt">+ <span data-i18n="it_part"></span></button>
      <button class="btn quiet sm" id="bh-them-dau">+ <span data-i18n="it_fuel"></span></button>
      <div class="grow"></div>
      <button class="btn" id="bh-huy"><span data-i18n="cancel"></span></button>
      <button class="btn primary" id="bh-luu"><span data-i18n="sale_issue"></span></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="hd"><h3 data-i18n="nav_sales"></h3><div class="grow"></div><span class="small muted" id="bh-tong"></span></div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th data-i18n="sale_no"></th><th data-i18n="c_date"></th><th data-i18n="customer"></th><th data-i18n="sale_lines"></th>
      <th class="num" data-i18n="amount"></th><th class="num" data-i18n="amount_lak"></th><th data-i18n="status"></th><th data-i18n="by_user"></th><th class="no-print" data-i18n="actions"></th></tr></thead>
    <tbody id="bh-than"></tbody>
  </table></div>
</div>
