<!-- Đề nghị theo DO (sếp 30/09: "trang quản lý DO nào phiếu chi gì trạng thái gì, DO nào phiếu thu gì trạng thái gì").
     Tab "Theo DO": mỗi DO một dòng — đề nghị chi (tạm ứng, nhiên liệu, chi các mục III–VI), đề nghị thu, số tờ chứng từ đã
     đối chiếu; bấm một DO → khung phải kể từng tờ. Tờ để in ở hai màn Phiếu đề nghị chi / Phiếu đề nghị thu.
     Tab "Sổ chứng từ" (01/10, bỏ trang kế toán tạm phần tiền): tờ chứng từ bên mình sinh để in / xem / định khoản và đánh
     dấu đối chiếu tay — không còn đẩy sang đâu; việc tiền đi qua hệ kế toán (anh Tune). -->
<div class="ct2">
  <div class="ct2-top no-print">
    <div class="seg" id="ct2-tab">
      <button class="on" data-tab="do"><span data-i18n="ct_theo_do"></span></button>
      <button data-tab="so"><span data-i18n="ct_so_chung_tu"></span></button>
    </div>
    <div class="seg ct2-khi-do" id="ct2-loc">
      <button class="on" data-loc=""><span data-i18n="all"></span><b id="ct2-n-all">·</b></button>
      <button data-loc="chi"><span data-i18n="ct_loc_chi"></span><b id="ct2-n-chi">·</b></button>
      <button data-loc="xk"><span data-i18n="ct_loc_xk"></span><b id="ct2-n-xk">·</b></button>
      <button data-loc="thu"><span data-i18n="ct_loc_thu"></span><b id="ct2-n-thu">·</b></button>
    </div>
    <label class="o-tim ct2-khi-do">
      <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M21 21l-5-5"/></svg>
      <input id="ct2-tim" type="search" autocomplete="off" data-i18n-ph="td_search">
    </label>
    <div class="grow"></div>
    <div class="field ct2-khi-do"><label data-i18n="month"></label><input type="month" id="ct2-thang"></div>
  </div>

  <div class="ct2-than" id="ct2-do">
    <!-- 01/10: vào màn mà tháng này chưa có DO thì tự sang tháng gần nhất có DO — #ct2-bao nói rõ đang xem tháng nào -->
    <section class="ct2-trai"><div class="ct2-bao" id="ct2-bao" role="status" hidden></div><div class="tbl-wrap"><table class="tbl ct2-bang" id="ct2-bang"></table></div></section>
    <aside class="ct2-phai" id="ct2-ct"></aside>
  </div>

  <!-- Sổ chứng từ: mỗi bước nghiệp vụ sinh một tờ (DO, PLNL, PTU, PDT, PC_TU…) kèm định khoản gợi ý — in / xem, đối chiếu
       xong với hệ kế toán thì đánh dấu tay. Không phải sổ kế toán. Thanh "Kết nối kế toán" + nút Đẩy đã bỏ 01/10. -->
  <div class="card" id="ct-so-ct" hidden>
    <div class="hd">
      <h3 data-i18n="ct_so_chung_tu"></h3><div class="grow"></div>
      <div class="field"><label data-i18n="ct_loai"></label><select id="ct-so-loai"><option value="" data-i18n="all"></option></select></div>
      <div class="field"><label data-i18n="ct_tu"></label><input type="date" id="ct-so-tu"></div>
      <div class="field"><label data-i18n="ct_den"></label><input type="date" id="ct-so-den"></div>
      <label class="ct-check"><input type="checkbox" id="ct-so-chua"> <span data-i18n="ct_chua_day"></span></label>
      <!-- Sếp: hai mã bên kế toán cấp (hàng khách gửi · giá vốn) — hết địa chỉ / khoá trang kế toán tạm -->
      <button type="button" class="btn sm no-print" id="ct-cau-hinh" hidden><span data-i18n="ct_cau_hinh"></span></button>
    </div>
    <div class="bd small muted" data-i18n="ct_hint_so"></div>
    <div class="ct-tong-loai" id="ct-so-tong"></div>
    <div class="tbl-wrap"><table class="tbl tbl-compact" id="ct-so-bang">
      <thead><tr><th data-i18n="voucher_no"></th><th data-i18n="c_date"></th><th data-i18n="ct_loai"></th><th data-i18n="doc_no"></th><th data-i18n="ct_doi_tuong"></th>
        <th class="num" data-i18n="amount"></th><th class="num" data-i18n="amount_lak"></th><th data-i18n="ct_no_co"></th><th data-i18n="note"></th><th data-i18n="status"></th><th class="no-print"></th></tr></thead>
      <tbody id="ct-so-than"></tbody></table></div>
  </div>
</div>
