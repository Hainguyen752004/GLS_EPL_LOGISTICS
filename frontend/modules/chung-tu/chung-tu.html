<!-- Đề nghị theo DO (sếp 30/09: "trang quản lý DO nào phiếu chi gì trạng thái gì, DO nào phiếu thu gì trạng thái gì").
     Tab "Theo DO": mỗi DO một dòng — đề nghị chi (tạm ứng, nhiên liệu, chi các mục III–VI), đề nghị thu, hồ sơ đã gửi kế toán;
     bấm một DO → khung phải kể từng tờ. Tờ để in ở hai màn Phiếu đề nghị chi / Phiếu đề nghị thu.
     Tab "Hồ sơ gửi kế toán": sổ chứng từ cũ (hộp thư đi sang bên kế toán) — còn dùng trong lúc trang kế toán tạm còn chạy. -->
<div class="ct2">
  <div class="ct2-top no-print">
    <div class="seg" id="ct2-tab">
      <button class="on" data-tab="do"><span data-i18n="ct_theo_do"></span></button>
      <button data-tab="so"><span data-i18n="ct_so"></span></button>
    </div>
    <div class="seg ct2-khi-do" id="ct2-loc">
      <button class="on" data-loc=""><span data-i18n="all"></span><b id="ct2-n-all">·</b></button>
      <button data-loc="chi"><span data-i18n="ct_loc_chi"></span><b id="ct2-n-chi">·</b></button>
      <button data-loc="thu"><span data-i18n="ct_loc_thu"></span><b id="ct2-n-thu">·</b></button>
    </div>
    <label class="o-tim ct2-khi-do">
      <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M21 21l-5-5"/></svg>
      <input id="ct2-tim" type="search" autocomplete="off" data-i18n-ph="td_search">
    </label>
    <div class="grow"></div>
    <div class="field ct2-khi-do"><label data-i18n="month"></label><input type="month" id="ct2-thang"></div>
  </div>

  <div class="ct2-than" id="ct2-do">
    <section class="ct2-trai"><div class="tbl-wrap"><table class="tbl ct2-bang" id="ct2-bang"></table></div></section>
    <aside class="ct2-phai" id="ct2-ct"></aside>
  </div>

  <!-- Hồ sơ gửi kế toán (sổ chứng từ cũ): mỗi bước nghiệp vụ bỏ vào đây một tờ (DO, PLNL, PTU, PDT, PC_TU…), bên kế toán
       nhận (đẩy sang hoặc kéo GET /api/chung-tu?chua_day=1). Không phải sổ kế toán. -->
  <div class="card" id="ct-so-ct" hidden>
    <div class="hd">
      <h3 data-i18n="ct_so"></h3><div class="grow"></div>
      <div class="field"><label data-i18n="ct_loai"></label><select id="ct-so-loai"><option value="" data-i18n="all"></option></select></div>
      <div class="field"><label data-i18n="ct_tu"></label><input type="date" id="ct-so-tu"></div>
      <div class="field"><label data-i18n="ct_den"></label><input type="date" id="ct-so-den"></div>
      <label class="ct-check"><input type="checkbox" id="ct-so-chua"> <span data-i18n="ct_chua_day"></span></label>
    </div>
    <div class="bd small muted" data-i18n="ct_hint"></div>
    <div class="ct-ket-noi no-print" id="ct-ket-noi"></div>
    <div class="ct-tong-loai" id="ct-so-tong"></div>
    <div class="tbl-wrap"><table class="tbl tbl-compact" id="ct-so-bang">
      <thead><tr><th data-i18n="voucher_no"></th><th data-i18n="c_date"></th><th data-i18n="ct_loai"></th><th data-i18n="doc_no"></th><th data-i18n="ct_doi_tuong"></th>
        <th class="num" data-i18n="amount"></th><th class="num" data-i18n="amount_lak"></th><th data-i18n="ct_no_co"></th><th data-i18n="note"></th><th data-i18n="ct_day_tt"></th><th></th></tr></thead>
      <tbody id="ct-so-than"></tbody></table></div>
  </div>
</div>
