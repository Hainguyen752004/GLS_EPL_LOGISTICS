<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – EPL Logistics</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login">
  <!-- Nửa trái: thương hiệu + sơ đồ tuyến -->
  <aside class="hero">
    <div class="hero__brand">
      <div class="hero__logo">EPL</div>
      <div><div class="hero__name">EPL Logistics</div><div class="hero__sub lo" data-t="brand_sub"></div></div>
    </div>
    <div class="hero__body">
      <div>
        <h1 data-t="title"></h1>
        <div class="hero__title2 lo" data-t2="title"></div>
        <p class="hero__desc" data-t="desc"></p>
      </div>
      <svg class="route" viewBox="0 0 640 420" fill="none" aria-hidden="true">
        <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#fff" stroke-opacity=".06"/></pattern></defs>
        <rect width="640" height="420" fill="url(#grid)"/>
        <path d="M90 90 C 160 120, 200 170, 250 190 S 360 230, 400 300 S 500 340, 560 350" stroke="#7fc8ad" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>
        <path class="route__done" d="M90 90 C 160 120, 200 170, 250 190 S 360 230, 400 300" stroke="#7fc8ad" stroke-width="3"/>
        <circle cx="90" cy="90" r="9" fill="#0b2a22" stroke="#7fc8ad" stroke-width="3"/><text x="110" y="86">Vientiane</text><text class="sm" x="110" y="106" data-t="stop1"></text>
        <circle cx="250" cy="190" r="8" fill="#0b2a22" stroke="#7fc8ad" stroke-width="3"/><text x="266" y="184">Dansavanh – Lao Bảo</text><text class="sm" x="266" y="204" data-t="stop2"></text>
        <circle class="pulse" cx="400" cy="300" r="9" fill="#7fc8ad" stroke="#fff" stroke-width="3"/><text x="418" y="296">Đà Nẵng</text><text class="sm" x="418" y="316" data-t="stop3"></text>
        <circle cx="560" cy="350" r="7" fill="#0b2a22" stroke="#7fc8ad" stroke-opacity=".5" stroke-width="3"/><text class="dim" x="500" y="384">TP.HCM</text>
        <g transform="translate(372,262)"><rect width="56" height="26" rx="6" fill="#1f8a6a"/><text x="28" y="17" fill="#fff" font-size="11" font-weight="600" text-anchor="middle" data-t="badge"></text></g>
      </svg>
      <div class="feats">
        <div class="feat"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><div><b data-t="f1"></b><span class="lo" data-t2="f1"></span></div></div>
        <div class="feat"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7.5 18H14a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7.5"/></svg><div><b data-t="f2"></b><span class="lo" data-t2="f2"></span></div></div>
        <div class="feat"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><div><b data-t="f3"></b><span class="lo" data-t2="f3"></span></div></div>
      </div>
    </div>
    <div class="hero__foot">Samket Village, Sikhottabong · Vientiane · 020 5889 9983</div>
  </aside>

  <!-- Nửa phải: form -->
  <main class="panel">
    <div class="panel__top">
      <div class="langs" id="langs">
        <button data-lang="vi">Tiếng Việt</button><button data-lang="lo" class="lo">ພາສາລາວ</button><button data-lang="en">English</button><button data-lang="vi+lo">VI + <span class="lo">ລາວ</span></button>
      </div>
    </div>
    <div class="panel__head">
      <h2><span data-t="login"></span> <small class="lo" data-t2="login"></small></h2>
      <div class="demo"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span data-t="demo"></span><span class="lo dim" data-t2="demo"></span></div>
    </div>
    <form class="form" id="form" novalidate>
      <label class="field"><span class="field__label"><b data-t="user"></b><i class="lo" data-t2="user"></i></span>
        <span class="field__box"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="username" name="username" autocomplete="username" value="admin" required></span></label>
      <label class="field"><span class="field__label"><b data-t="pass"></b><i class="lo" data-t2="pass"></i></span>
        <span class="field__box"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" value="1234" required>
          <button type="button" class="eye" id="eye" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
      <div class="row">
        <label class="remember"><input type="checkbox" id="remember" checked><span data-t="remember"></span><i class="lo dim" data-t2="remember"></i></label>
        <a href="#" data-t="forgot"></a>
      </div>
      <div class="error" id="error" hidden></div>
      <button class="submit" type="submit"><span data-t="login"></span><small class="lo" data-t2="login"></small><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
    </form>
    <div class="divider"><span data-t="quick"></span><span class="lo dim" data-t2="quick"></span></div>
    <div class="roles" id="roles"></div>
  </main>
</div>
<!-- Cấu hình tích hợp (tùy chọn) — xem README.md -->
<script>
  window.EPL_LOGIN_CONFIG = {
    redirect: "index.html",          // trang vào sau khi đăng nhập
    // authenticate: async (username, password) => { const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }) }); return r.ok ? await r.json() : null; },
    // showQuickPick: false,         // ẩn khung "chọn nhanh theo vai trò" khi lên môi trường thật
  };
</script>
<script src="login.js"></script>
</body>
</html>
