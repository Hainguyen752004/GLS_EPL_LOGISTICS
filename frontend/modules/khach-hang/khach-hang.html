<!-- Khách hàng — ລູກຄ້າ. Dàn ngang (30/09): danh sách khách bên trái; bên phải thẻ khách và ba tab Hợp đồng · Bảng giá ·
     Công nợ mở ngay tại chỗ. Bảng giá, công nợ là tiền — Bãi không có hai tab này. -->
<div class="kh2">
<aside class="kh2-trai">
  <div class="kh2-dau">

    <div class="grow"></div>
