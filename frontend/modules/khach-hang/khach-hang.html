<!-- Khách hàng — ລູກຄ້າ. Giao diện theo bản mẫu chủ dự án gửi chiều 30/09 (Khach_Hang_new.zip): trái là danh sách khách,
     phải là hồ sơ khách, dải hợp đồng đang áp dụng và bốn tab Hợp đồng · Bảng giá · Chuyến & phiếu · Công nợ.
     Tiêu đề và hai nút Excel / PDF nằm ở thanh đầu trang chung. Bảng giá, công nợ, số tiền: Bãi không thấy. -->
<div class="kh3">
  <div class="k3-dau">
    <p class="k3-phu" id="k3-phu"></p>
    <button class="k3-btn k3-btn--primary" id="k3-them" type="button" data-act="add-customer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="k3_them_khach"></span>
    </button>
  </div>

  <div class="layout">
    <aside class="rail">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="k3-tim" type="search" data-i18n-ph="k3_tim" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="filters" role="group" id="k3-loc">
        <button type="button" class="chip is-on" data-filter="all" data-i18n="all"></button>
        <button type="button" class="chip" data-filter="expiring" data-i18n="hd_sap_het"></button>
        <button type="button" class="chip" data-filter="nocontract" data-i18n="k3_chua_hd"></button>
        <button type="button" class="chip" data-filter="debt" data-i18n="k3_con_no"></button>
      </div>
      <p class="rail-count" id="k3-dem"></p>
      <ul class="cust-list" id="k3-ds"></ul>
    </aside>

    <main class="work" id="k3-work" tabindex="-1"></main>
  </div>

  <!-- hộp thoại dùng chung của màn: thêm / sửa / gia hạn hợp đồng, thêm / sửa khách hàng -->
  <dialog class="modal" id="k3-modal">
    <form method="dialog" id="k3-form" novalidate></form>
  </dialog>
</div>
