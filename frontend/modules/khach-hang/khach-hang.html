<!-- Khách hàng — ລູກຄ້າ. Danh mục duy nhất họ còn dùng: tên, điện thoại, địa chỉ, ghi chú. -->
<div class="toolbar">
  <div class="field kh-tim"><label data-i18n="search"></label><input id="kh-q"></div>
  <div class="grow"></div>
  <button class="btn primary" id="kh-them"><span data-i18n="add"></span></button>
</div>
<div class="card">
  <div class="tbl-wrap">
    <table class="tbl">
      <thead><tr><th>#</th><th data-i18n="name"></th><th data-i18n="phone"></th><th data-i18n="address"></th><th data-i18n="note"></th><th data-i18n="inv_mode"></th><th data-i18n="hd_van_chuyen"></th><th data-i18n="status"></th><th class="no-print" data-i18n="actions"></th></tr></thead>
      <tbody id="kh-than"></tbody>
    </table>
  </div>
</div>

<!-- Hợp đồng vận chuyển của khách (chốt 24/09) — js/hop_dong.js vẽ vào đây -->
<div class="card hd-khung" id="kh-hd" hidden></div>

<!-- Bảng giá khách × tuyến (K3): bấm "Bảng giá" ở một khách thì khối này hiện ra. Bãi không thấy (tiền). -->
<div class="card kh-gia" id="kh-gia" hidden>
  <div class="kh-gia-dau">
    <div><h3 id="kh-gia-ten"></h3><div class="small muted" data-i18n="kh_gia_mota"></div></div>
    <div class="grow"></div>
    <button class="btn primary sm" id="kh-gia-them"><span data-i18n="add"></span></button>
    <button class="btn sm" id="kh-gia-dong"><span data-i18n="close"></span></button>
  </div>
  <div class="tbl-wrap">
    <table class="tbl">
      <thead><tr><th data-i18n="route"></th><th data-i18n="goods_type"></th><th data-i18n="c_ccy"></th><th class="num" data-i18n="price_usd"></th><th class="num" data-i18n="hire_pt"></th><th data-i18n="valid_from"></th><th data-i18n="note"></th><th data-i18n="status"></th><th class="no-print" data-i18n="actions"></th></tr></thead>
      <tbody id="kh-gia-than"></tbody>
    </table>
  </div>
</div>

<!-- Công nợ khách: khách này còn nợ EPL bao nhiêu — gộp hoá đơn lẻ + hoá đơn gộp − đã thu. Bãi không thấy (tiền). -->
<div class="card kh-gia tien" id="kh-no" hidden>
  <div class="kh-gia-dau">
    <h3 id="kh-no-ten"></h3>
    <div class="grow"></div>
    <button class="btn sm" id="kh-no-dong"><span data-i18n="close"></span></button>
  </div>
  <div class="bd" id="kh-no-tong"></div>
  <div class="tbl-wrap">
    <table class="tbl">
      <thead><tr><th data-i18n="type"></th><th data-i18n="doc_no"></th><th data-i18n="c_date"></th><th data-i18n="ccy"></th>
        <th class="num" data-i18n="c_value"></th><th class="num" data-i18n="in_lak"></th><th class="num" data-i18n="collected"></th>
        <th class="num" data-i18n="remaining"></th><th data-i18n="c_st_f"></th></tr></thead>
      <tbody id="kh-no-than"></tbody>
    </table>
  </div>
</div>
