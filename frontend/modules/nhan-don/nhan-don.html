<div class="man-dau">
  <h2 data-i18n="nd_title"></h2>
  <p class="gioi-thieu" data-i18n="nd_intro"></p>
</div>

<div class="nd-thanh the">
  <div class="the-than nd-thanh-trong">
    <div class="nd-nguon">
      <button type="button" class="nut chinh" id="nd-quet"></button>
      <label class="nut" id="nd-tai-len-nhan">
        <span data-i18n="nd_upload"></span>
        <input type="file" id="nd-tep" accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xls,.xlsm,.csv,.txt" hidden>
      </label>
      <button type="button" class="nut nho" id="nd-lam-moi" data-i18n="common_refresh"></button>
    </div>
    <div class="nd-trang-thai" id="nd-ket-noi"></div>
  </div>
</div>

<div class="luoi-2">
  <div class="the">
    <div class="the-dau">
      <h3 data-i18n="nd_inbox"></h3>
      <span class="nhan xam" id="nd-dem"></span>
    </div>
    <div class="the-than" style="padding-bottom:8px">
      <select id="nd-loc"></select>
      <input type="text" id="nd-tim" data-i18n-ph="nd_search_ph" style="margin-top:8px">
    </div>
    <div class="ds" id="nd-danh-sach"></div>
  </div>

  <div id="nd-chi-tiet">
    <div class="the"><div class="trong" data-i18n="nd_pick_hint"></div></div>
  </div>
</div>
