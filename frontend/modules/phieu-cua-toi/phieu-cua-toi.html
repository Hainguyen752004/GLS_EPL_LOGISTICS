<!-- Phiếu của tôi — ບິນຂອງຂ້ອຍ. Màn của TÀI XẾ, làm lại 30/09 (sếp: "phá cách, tôn trọng người Lào"): một VÉ CHUYẾN lớn cho
     chuyến đang chạy — tuyến chữ to, thanh các bước, MỘT nút lớn cho việc tiếp theo, việc phụ thành ô bấm to, mã QR phiếu đề
     nghị mở ngay tại đây. Chuyến khác nằm cột bên (điện thoại: dưới). Mọi hộp nhập giữ nguyên (ký nhận, cân mỏ, báo hỏng…). -->
<div class="pct">
  <div class="pct-dau">
    <div><div class="pct-ten" id="pct-ten"></div><div class="pct-vai" id="pct-vai"></div></div>
    <div class="pct-gps" id="pct-gps" hidden>
      <span class="cham"></span>
      <div><b data-i18n="gps_sharing"></b><div class="small" id="pct-gps-tin"></div></div>
    </div>
  </div>
  <div class="pct-mat-mang" id="pct-mat-mang" hidden></div>
  <div class="pct-than">
    <section class="pct-chinh" id="pct-ve"></section>
    <aside class="pct-ben"><h3 class="pct-h" data-i18n="recent_trips"></h3><div id="pct-ds" class="pct-ds"></div></aside>
  </div>
</div>

<!-- Mã QR phiếu đề nghị (tạm ứng · nhiên liệu): tài xế đưa màn này cho quỹ / thủ kho quét -->
<dialog id="pct-qr" class="hop-thoai pct-qr-hop">
  <div class="pct-qr-than">
    <div class="pct-qr-dau"><h3 id="pct-qr-tieu"></h3><button type="button" class="btn quiet" id="pct-qr-dong" data-i18n="cancel"></button></div>
    <div class="pct-qr-chon" id="pct-qr-chon"></div>
    <img id="pct-qr-anh" alt="QR" width="260" height="260">
    <div class="pct-qr-ma" id="pct-qr-ma"></div>
    <p class="small muted" data-i18n="v_qr_hint"></p>
  </div>
</dialog>

<dialog id="pct-hop" class="hop-thoai">
  <form method="dialog">
    <h3 data-i18n="report_breakdown"></h3>
    <div class="f-grid">
      <div class="field"><label data-i18n="incident_type"></label><select id="pct-f-loai"><option value="breakdown" data-i18n="inc_breakdown"></option><option value="accident" data-i18n="inc_accident"></option><option value="delay" data-i18n="inc_delay"></option><option value="other" data-i18n="inc_other"></option></select></div>
      <div class="field"><label data-i18n="stop"></label><select id="pct-f-diem"></select></div>
      <div class="field w2"><label data-i18n="what_broke"></label><textarea id="pct-f-ghi" rows="3" lang="lo"></textarea></div>
      <div class="field"><label data-i18n="reported_cost"></label><input class="num" id="pct-f-tien" inputmode="decimal"></div>
      <div class="field"><label data-i18n="cur"></label><select id="pct-f-tt"><option>LAK</option><option>VND</option><option>THB</option><option>USD</option></select></div>
    </div>
    <div class="ht-nut"><button class="btn" value="huy" data-i18n="cancel"></button><button class="btn primary" value="ok" data-i18n="report_breakdown"></button></div>
  </form>
</dialog>

<!-- Hộp khai đổ nhiên liệu dọc đường: dầu MUA, không phải lĩnh kho -->
<dialog id="pct-dau" class="hop-thoai">
  <form method="dialog">
    <h3 data-i18n="df_declare"></h3>
    <p class="small muted" data-i18n="df_hint"></p>
    <div class="f-grid">
      <div class="field w2"><label data-i18n="df_where"></label><select id="pct-d-diem"></select></div>
      <div class="field"><label data-i18n="df_litres"></label><input class="num" id="pct-d-lit" inputmode="decimal"></div>
      <!-- đơn giá: tài xế không nhập (C5.1) — KT kho xăng dầu nhập khi kiểm mục III -->
      <input type="hidden" id="pct-d-gia">
      <div class="field"><label data-i18n="cur"></label><select id="pct-d-tt"><option>VND</option><option>LAK</option><option>THB</option><option>USD</option></select></div>
      <div class="field w2"><label data-i18n="note"></label><input id="pct-d-ghi" lang="lo"></div>
    </div>
    <div class="ht-nut"><button class="btn" value="huy" data-i18n="cancel"></button>
      <button class="btn primary" value="ok" data-i18n="df_declare"></button></div>
  </form>
</dialog>

<!-- Báo cân ở mỏ (chốt 29/09): phiếu gom — tài xế ghi số tấn theo phiếu cân, chụp phiếu. Mất mạng vẫn báo được — máy giữ lại, có mạng tự gửi. -->
<dialog id="pct-cm" class="hop-thoai pct-gh">
  <div class="pct-gh-than">
    <h3 data-i18n="cm_nut"></h3>
    <div class="small muted" id="pct-cm-phieu"></div>
    <p class="small muted" data-i18n="cm_hint"></p>
    <div class="f-grid">
      <div class="field"><label data-i18n="w_origin_gom"></label><input class="num pct-cm-tan" id="pct-cm-tan" type="number" step="any" inputmode="decimal" autocomplete="off"></div>
      <div class="field w2"><label data-i18n="note"></label><input id="pct-cm-ghi" lang="lo" autocomplete="off"></div>
    </div>
    <label class="btn pct-gh-chup"><span data-i18n="cm_chup"></span>
      <input type="file" id="pct-cm-anh" accept="image/*,application/pdf" capture="environment" multiple hidden></label>
    <div class="pct-gh-anh" id="pct-cm-xem-anh"></div>
    <div class="ht-nut"><button type="button" class="btn" id="pct-cm-huy" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="pct-cm-gui" data-i18n="gh_gui"></button></div>
  </div>
</dialog>

<!-- Giao hàng hoàn tất (chốt 24/09): người nhận ký ngay trên điện thoại tài xế. Mất mạng vẫn ký được — máy giữ lại, có mạng tự gửi. -->
<dialog id="pct-gh" class="hop-thoai pct-gh">
  <div class="pct-gh-than">
    <h3 data-i18n="gh_nut"></h3>
    <div class="small muted" id="pct-gh-phieu"></div>
    <div class="f-grid">
      <div class="field w2"><label data-i18n="pod_receiver"></label><input id="pct-gh-ten" lang="lo" autocomplete="off"></div>
      <div class="field"><label data-i18n="gh_sdt"></label><input id="pct-gh-sdt" type="tel" inputmode="tel" autocomplete="off"></div>
      <div class="field"><label data-i18n="gh_tinh_trang"></label>
        <select id="pct-gh-tt"><option value="du" data-i18n="gh_tt_du"></option><option value="thieu" data-i18n="gh_tt_thieu"></option><option value="hong" data-i18n="gh_tt_hong"></option></select></div>
      <div class="field w2"><label data-i18n="note"></label><textarea id="pct-gh-ghi" rows="2" lang="lo"></textarea></div>
    </div>
    <div class="pct-gh-ky">
      <div class="pct-gh-ky-dau"><b data-i18n="gh_chu_ky_nhan"></b><div class="grow"></div>
        <button type="button" class="btn sm" id="pct-gh-xoa-ky" data-i18n="gh_ky_lai"></button></div>
      <canvas id="pct-gh-canvas"></canvas>
    </div>
    <label class="btn pct-gh-chup"><span data-i18n="gh_chup"></span>
      <input type="file" id="pct-gh-anh" accept="image/*,application/pdf" capture="environment" multiple hidden></label>
    <div class="pct-gh-anh" id="pct-gh-xem-anh"></div>
    <div class="small pct-gh-gps" id="pct-gh-gps"></div>
    <div class="ht-nut"><button type="button" class="btn" id="pct-gh-huy" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="pct-gh-gui" data-i18n="gh_gui"></button></div>
  </div>
</dialog>
