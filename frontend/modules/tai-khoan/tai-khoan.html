<!-- Tài khoản — chỉ quản trị. Hai tab:
     · Người dùng: tên đăng nhập, họ tên, vai, đổi mật khẩu, khoá.
     · Vai trò & trách nhiệm: mỗi vai ai đang giữ, làm công đoạn nào, vào màn nào, được nhập / kiểm / ghi sổ / chi mục
       nào, thấy tiền không, và SINH RA những chứng từ nào. Quyền và định khoản lấy từ máy chủ (/api/quy-trinh);
       công đoạn lấy từ màn Quy trình — một nguồn, không chép hai nơi. -->
<div class="toolbar">
  <div class="qt-tab tk-tab" role="tablist">
    <button class="active" data-tk="nguoi">Người dùng</button>
    <button data-tk="vai">Vai trò &amp; trách nhiệm</button>
    <button data-tk="lt" data-i18n="tk_lt_tab"></button>
  </div>
  <div class="grow"></div>
  <button class="btn primary" id="tk-them"><span data-i18n="add"></span></button>
</div>
<div class="card" id="tk-nguoi">
  <div class="tbl-wrap">
    <table class="tbl">
      <thead><tr><th>#</th><th data-i18n="username"></th><th data-i18n="full_name"></th><th data-i18n="role"></th><th>Làm gì</th><th data-i18n="status"></th><th data-i18n="actions"></th></tr></thead>
      <tbody id="tk-than"></tbody>
    </table>
  </div>
</div>
<div id="tk-vai" hidden>
  <p class="small muted tk-dan">Mỗi vai theo đúng bảng "Nhiệm Vụ" trong Excel của khách. Quyền trên phiếu, quyền thấy tiền và định khoản
    in ra từ luật đang chạy của máy chủ. Bấm tên chứng từ để mở màn Quy trình ở đúng dòng đó.</p>
  <div class="tk-luoi" id="tk-vai-ds"></div>
</div>
<!-- Liên thông (28/09): kho và tiền vận chuyển nằm bên trang kế toán; hai trang gọi nhau bằng khoá máy -->
<div class="card tk-lt" id="tk-lt" hidden>
  <div class="bd">
    <label class="tk-lt-o"><span data-i18n="tk_lt_api"></span><input id="tk-lt-api" spellcheck="false" placeholder="http://127.0.0.1:8030"></label>
    <label class="tk-lt-o"><span data-i18n="tk_lt_web"></span><input id="tk-lt-web" spellcheck="false" placeholder="http://127.0.0.1:8030">
      <small class="muted" data-i18n="tk_lt_web_hint"></small></label>
    <label class="tk-lt-o"><span data-i18n="tk_lt_day"></span><input id="tk-lt-day" type="password" autocomplete="off">
      <small class="muted" data-i18n="tk_lt_day_hint"></small></label>
    <div class="tk-lt-o"><span data-i18n="tk_lt_nhan"></span><b id="tk-lt-nhan"></b>
      <small class="muted" data-i18n="tk_lt_tao_hint"></small>
      <code class="tk-lt-khoa" id="tk-lt-khoa" hidden></code></div>
    <div class="tk-lt-kq" id="tk-lt-kq"></div>
    <div class="tk-lt-nut">
      <button class="btn" id="tk-lt-tao" data-i18n="tk_lt_tao"></button>
      <button class="btn" id="tk-lt-thu" data-i18n="tk_lt_thu"></button>
      <button class="btn primary" id="tk-lt-luu" data-i18n="save"></button>
    </div>
  </div>
</div>
