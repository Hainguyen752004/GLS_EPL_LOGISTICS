     Kết luận "đủ điều kiện điều phối" tính ở đây; màn Điều phối / Phiếu xuất xe đọc từ đây để chặn.
     Dữ liệu THẬT: GET/POST/PUT /api/drivers · GET /api/drivers/{id}/lich?tuan= · POST /api/drivers/{id}/licenses. -->
<div class="tx-toolbar">
