<!-- Theo dõi tuyến — dựng lại theo bản mẫu "trip-tracking" anh gửi: ba cột vừa MỘT màn hình,
     khối nào cuộn trong khối đó, cột giữa gộp bản đồ + mốc chặng + ba tab (Diễn biến · Chi phí sửa
     chữa · Chứng từ), cột phải là hồ sơ chuyến với trình tự duyệt và các nút thao tác.

     Khác bản mẫu một chỗ cố ý: BẢN ĐỒ LÀ LEAFLET THẬT với GPS của tài xế, không phải hình SVG minh
     hoạ — đúng như README của bản mẫu dặn khi đã có GPS. Mọi con số lấy từ máy chủ, không có dữ
     liệu giả và không lưu localStorage.

     Sự cố / sửa xe khai ở màn này rơi vào mục V của phiếu xuất xe. -->
<div class="tdt2">
  <div class="tdt2-top">
    <div class="tdt2-top__l">
      <label class="tdt2-tim">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="tdt-q" type="search" autocomplete="off" data-i18n-ph="td_search">
      </label>
      <label class="tdt2-chk"><input type="checkbox" id="tdt-chi-chay" checked><span data-i18n="td_only_run"></span></label>
      <label class="tdt2-chk"><input type="checkbox" id="tdt-tu-dong"><span data-i18n="td_auto"></span></label>
      <span class="tdt2-luc" id="tdt-luc"></span>
    </div>
    <div class="tdt2-top__r">
      <button class="tdt2-btn" id="tdt-lam-moi" type="button">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span data-i18n="td_refresh"></span></button>
      <button class="tdt2-btn" id="tdt-so-su-co" type="button"><span data-i18n="td_book"></span></button>
      <button class="tdt2-btn tan" id="tdt-su-co" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".8"/></svg><span data-i18n="report_incident"></span></button>
    </div>
  </div>

  <!-- Dải ô số: bấm một ô là lọc danh sách theo đúng ô đó, bấm lại thì bỏ lọc -->
  <div class="tdt2-tiles" id="tdt-o-so"></div>

  <div class="tdt2-cols" id="tdt-cols">
    <!-- Cột trái: danh sách chuyến -->
    <section class="tdt2-card">
      <div class="tdt2-hd"><b data-i18n="td_watch"></b><span class="tdt2-mo" id="tdt-dem"></span></div>
      <div class="tdt2-sub">
        <div class="tdt2-seg" id="tdt-sap" role="tablist">
          <button class="active" data-sap="uu-tien" data-i18n="td_by_pri"></button>
          <button data-sap="ngay" data-i18n="td_by_date"></button>
          <button data-sap="khach" data-i18n="td_by_cust"></button>
        </div>
      </div>
      <div class="tdt2-cuon" id="tdt-the-ds"></div>
    </section>

    <!-- Cột giữa: bản đồ thật + mốc chặng + ba tab -->
    <section class="tdt2-card">
      <div class="tdt2-hd">
        <b data-i18n="map_title"></b>
        <div class="tdt2-hd-phai">
          <div class="tdt2-seg" id="tdt-bd-tab" role="tablist">
            <button data-bd="doi" data-i18n="map_fleet"></button>
            <button class="active" data-bd="mot" data-i18n="map_one"></button>
          </div>
          <div class="tdt2-chu-thich">
            <span><i class="chay"></i><span data-i18n="map_running"></span></span>
            <span><i class="lau"></i><span data-i18n="map_late"></span></span>
            <span><i class="su-co"></i><span data-i18n="map_inc"></span></span>
            <span><i class="khong"></i><span data-i18n="map_nopos"></span></span>
          </div>
          <select id="tdt-nen" class="tdt2-nen">
            <option value="ve-tinh" data-i18n="map_sat"></option>
            <option value="duong" data-i18n="map_road"></option>
          </select>
        </div>
      </div>
      <div class="tdt-map" id="tdt-map"></div>
      <div class="tdt2-moc" id="tdt-moc"></div>
      <div class="tdt2-moc-chan" id="tdt-moc-chan"></div>
      <div class="tdt2-tabs"><div class="tdt2-tabs__ds" id="tdt-tabs"></div><div class="tdt2-tabs__nut" id="tdt-tab-nut"></div></div>
      <div class="tdt2-cuon tdt2-tab-than" id="tdt-tab-than"></div>
    </section>

    <!-- Cột phải: thanh xem nhanh hồ sơ chuyến — trượt ra khi bấm một phiếu ở cột trái,
         bấm × thì thu lại và bản đồ ăn hết chỗ trống. -->
    <aside class="tdt2-card ho-so" id="tdt-ho-so">
      <div class="tdt2-hd"><b data-i18n="td_profile"></b>
        <div class="tdt2-hd-phai">
          <button class="tdt2-btn sm" id="tdt-mo-phieu" type="button">
            <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span data-i18n="open_slip"></span></button>
          <button class="tdt2-dong" id="tdt-dong-hs" type="button" data-i18n-title="td_hide_profile">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </div>
      <div class="tdt2-cuon tdt2-ho-so" id="tdt-xe"></div>
    </aside>
  </div>
</div>

<!-- Hộp báo sự cố / sửa xe -->
<dialog id="tdt-hop" class="hop-thoai tdt-hop">
  <form method="dialog">
    <h3 data-i18n="report_incident"></h3>
    <div class="f-grid">
      <div class="field"><label data-i18n="incident_type"></label><select id="tdt-f-loai"><option value="breakdown" data-i18n="inc_breakdown"></option><option value="tire" data-i18n="inc_tire"></option><option value="accident" data-i18n="inc_accident"></option><option value="delay" data-i18n="inc_delay"></option><option value="held" data-i18n="inc_held"></option><option value="other" data-i18n="inc_other"></option></select></div>
      <div class="field"><label data-i18n="stop"></label><select id="tdt-f-diem"></select></div>
      <div class="field w2"><label data-i18n="note"></label><input id="tdt-f-ghi" lang="lo"></div>
    </div>
    <label class="tdt-loc" style="margin-top:10px"><input type="checkbox" id="tdt-f-co-sua"> <b data-i18n="has_repair_cost"></b></label>
    <div id="tdt-f-sua" class="tdt-sua-khung" hidden>
      <p class="small muted" data-i18n="src_rule"></p>
      <div class="f-grid">
        <div class="field w2"><label data-i18n="source"></label>
          <div class="px-pay tdt-nguon"><button type="button" data-src="kho" class="on" data-i18n="src_kho"></button><button type="button" data-src="mua" data-i18n="src_mua"></button></div></div>
        <div class="field w2" id="tdt-f-o-part"><label data-i18n="pick_part"></label><select id="tdt-f-part"></select></div>
        <div class="field w2" id="tdt-f-o-ten" hidden><label data-i18n="item"></label><input id="tdt-f-ten" placeholder="…" lang="lo"></div>
        <div class="field"><label data-i18n="qty"></label><input class="num" id="tdt-f-sl" value="1" inputmode="decimal"></div>
        <div class="field"><label data-i18n="unit_price"></label><input class="num" id="tdt-f-gia" inputmode="decimal"></div>
        <div class="field"><label data-i18n="cur"></label><select id="tdt-f-tien"><option>LAK</option><option>VND</option><option>THB</option><option>USD</option></select></div>
      </div>
    </div>
    <div class="ht-nut"><button class="btn" value="huy" data-i18n="cancel"></button><button class="btn primary" value="ok" data-i18n="save"></button></div>
  </form>
</dialog>

<!-- Sổ sự cố: mọi diễn biến bất thường của mọi phiếu -->
<dialog id="tdt-so" class="hop-thoai tdt-so">
  <form method="dialog">
    <h3 data-i18n="td_book"></h3>
    <div class="tbl-wrap"><table class="tbl tbl-compact">
      <thead><tr><th data-i18n="c_date"></th><th data-i18n="doc_no"></th><th data-i18n="truck_no"></th><th data-i18n="type"></th>
        <th data-i18n="note"></th><th class="num" data-i18n="reported_cost"></th><th data-i18n="status"></th></tr></thead>
      <tbody id="tdt-so-than"></tbody></table></div>
    <div class="ht-nut"><button class="btn primary" value="ok" data-i18n="ok"></button></div>
  </form>
</dialog>
