<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theo dõi chuyến – EPL</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="trips.css">
</head>
<body>
<div class="app">
  <!-- Thanh trên -->
  <div class="topbar">
    <div class="topbar__left">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Tìm số phiếu, xe, tài xế, khách hàng" autocomplete="off"></label>
      <label class="chk"><input type="checkbox" id="only-open" checked>Chỉ phiếu chưa xong</label>
      <label class="chk"><input type="checkbox" id="auto-refresh">Tự cập nhật 30 giây</label>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="topbar__right">
      <button class="btn" id="btn-refresh" type="button"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>Cập nhật</button>
      <button class="btn" id="btn-incidents" type="button">Sổ sự cố</button>
      <button class="btn btn--tan" id="btn-incident" type="button"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".8"/></svg>Báo sự cố / sửa xe</button>
    </div>
  </div>
  <div class="tiles" id="tiles"></div>

  <!-- 3 cột -->
  <div class="cols">
    <section class="card col-left">
      <div class="card__head"><b>Chuyến đang theo dõi</b><span class="muted" id="trip-count"></span></div>
      <div class="card__sub"><div class="seg" id="sort-seg"><button data-sort="priority" class="active">Ưu tiên</button><button data-sort="date">Ngày đi</button><button data-sort="customer">Khách hàng</button></div></div>
      <div class="scroll" id="trip-list"></div>
    </section>

    <section class="card col-center">
      <div class="card__head"><b>Bản đồ tuyến</b>
        <div class="row" style="gap:10px"><div class="seg" id="map-seg"><button data-view="fleet" class="active">Đội xe</button><button data-view="route">Tuyến đang chọn</button></div>
          <div class="legend"><span><i style="background:var(--blue)"></i>Đang chạy</span><span><i style="background:var(--amber)"></i>Đi lâu</span><span><i style="background:var(--red)"></i>Có sự cố</span><span><i style="background:var(--faint)"></i>Chưa có vị trí</span></div></div></div>
      <div class="map" id="map"></div>
      <div class="stepper" id="stepper"></div>
      <div class="stepfoot" id="stepfoot"></div>
      <div class="tabs"><div class="tabs__list" id="tabs"></div><div class="row" id="tab-actions"></div></div>
      <div class="scroll tabbody" id="tabbody"></div>
    </section>

    <section class="card col-right">
      <div class="card__head"><b>Hồ sơ chuyến</b><button class="btn btn--sm" id="btn-open" type="button"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>Mở phiếu</button></div>
      <div class="scroll profile" id="profile"></div>
    </section>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
  /* Cấu hình tích hợp (tùy chọn) — xem README */
  window.TRIPS_CONFIG = {
    // trips: [...],                       // dữ liệu thật thay cho mẫu
    // onEvent: async (tripId, event) => {},   // gọi API khi ghi diễn biến / sự cố / xác nhận tới điểm
    // onCost:  async (tripId, cost) => {},    // gọi API khi khai chi phí sửa xe
    // openTicketUrl: (trip) => `/tickets/${trip.code}`,
  };
</script>
<script src="trips.js"></script>
</body>
</html>
