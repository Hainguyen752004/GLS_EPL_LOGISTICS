<!-- Tuyến đường — ເສັ້ນທາງ. Chặng A → B → C, km từng chặng, BOT.
     16/10 làm lại theo màn cấu hình tuyến của EPL_System (anh Hải: «quá lỏ»): bỏ hộp sửa nổi; một khung làm việc — trái là danh
     sách tuyến, phải là tuyến đang chọn: chặng Điểm đi → Điểm đến · km khai · km đường bộ đo được, cạnh bản đồ đánh số từng điểm.
     Sửa ngay tại chỗ; vị trí điểm chấm trên bản đồ (bấm · kéo · tìm tên · dán toạ độ) thay cho gõ vĩ độ / kinh độ.
     Chi phí gợi ý theo tuyến ở thẻ thứ hai — không xếp dọc dài. -->
<div class="tuy3" id="tuy3">
  <section class="card tuy3-ds">
    <div class="tuy3-ds-dau">
      <input id="tuy-q" type="search" data-i18n-ph="search" autocomplete="off">
      <button class="btn primary sm" id="tuy-them" type="button">+ <span data-i18n="tuy_them_tuyen"></span></button>
    </div>
    <div class="seg tuy3-loc" id="tuy-loc">
      <button type="button" data-loc="dang" class="on"><span data-i18n="active"></span><b></b></button>
      <button type="button" data-loc="ngung"><span data-i18n="inactive"></span><b></b></button>
      <button type="button" data-loc="tat"><span data-i18n="all"></span><b></b></button>
    </div>
    <div class="tuy3-ds-than">
      <table class="tbl tuy3-bang">
        <thead><tr><th>#</th><th data-i18n="route_name"></th><th class="num" data-i18n="total_km"></th></tr></thead>
        <tbody id="tuy-than"></tbody>
      </table>
    </div>
    <div class="small muted tuy3-goi-y" data-i18n="route_hint"></div>
  </section>

  <section class="card tuy3-ws" id="tuy-ws">
    <div class="tuy3-dau" id="tuy-dau"></div>
    <div class="tuy3-tom" id="tuy-tom"></div>
    <div class="tuy3-the">
      <div class="seg" id="tuy-tab">
        <button type="button" data-tab="chang" class="on"><span data-i18n="tuy_tab_chang"></span></button>
        <button type="button" data-tab="tram"><span data-i18n="tuy_tab_tram"></span><b id="tuy-tram-dem"></b></button>
        <button type="button" data-tab="cp"><span data-i18n="tuy_tab_cp"></span><b id="tuy-cp-dem"></b></button>
      </div>
      <div class="grow"></div>
      <div class="tuy3-the-phai" id="tuy-the-phai"></div>
    </div>
    <!-- bản đồ dùng chung cho thẻ «Chặng & bản đồ» và thẻ «Trạm thu phí» (16/10) — sửa trạm vẫn thấy trạm nằm đâu trên đường -->
    <div class="tuy3-noi tuy3-noi-chang">
      <div class="tuy3-trai">
        <div class="tuy3-chang" id="tuy-chang" data-tab-noi="chang"></div>
        <div class="tuy3-chang" id="tuy-tram" data-tab-noi="tram" hidden></div>
      </div>
      <div class="tuy3-map-o">
        <div class="tuy3-map" id="tuy-map"></div>
        <div class="seg tuy3-nen" id="tuy-nen">
          <button type="button" data-nen="duong" class="on"><span data-i18n="map_road"></span></button>
          <button type="button" data-nen="ve-tinh"><span data-i18n="map_sat"></span></button>
        </div>
        <div class="tuy3-pick" id="tuy-pick" hidden></div>
        <div class="tuy3-map-bao" id="tuy-map-bao" hidden></div>
      </div>
    </div>
    <div class="tuy3-noi tuy3-noi-cp" hidden><div id="tuy-cp"></div></div>
    <div class="tuy3-trong" id="tuy-trong" hidden><span data-i18n="tuy_chua_chon"></span></div>
  </section>
</div>
